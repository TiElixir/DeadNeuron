# Topic-neutral controls: generic prompts, plain paragraphs for perplexity, and general-knowledge probes.
control:
  - How do I boil an egg so the yolk stays soft?
  - What is the difference between baking soda and baking powder?
  - Give me a simple recipe for tomato soup.
  - How long should I rest a steak after cooking?
  - What is 17 multiplied by 23?
  - Explain what a prime number is.
  - How do I convert a fraction to a decimal?
  - What is the Pythagorean theorem?
  - "Solve for x: 3x + 7 = 22."
  - What caused the fall of the Roman Empire?
  - Who was Cleopatra?
  - Summarize the main events of the French Revolution.
  - What was the Silk Road used for?
  - When did the printing press change Europe?
  - Write a Python function that reverses a string.
  - What is the difference between a list and a tuple in Python?
  - Explain what a hash table is.
  - How does a for loop work?
  - What does the git commit command do?
  - What causes rain?
  - Why is the sky blue?
